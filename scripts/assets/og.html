<!doctype html>
<!-- Source of public/og.png (1200×630). Regenerate with `pnpm assets`. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=IBM+Plex+Mono:wght@400&display=block"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #ffffff;
        color: #0a0a0a;
      }
      .frame {
        box-sizing: border-box;
        height: 100%;
        padding: 64px 72px;
        display: flex;
        gap: 48px;
        align-items: stretch;
      }
      .text {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border-top: 2px solid #0a0a0a;
        padding-top: 28px;
      }
      .kicker {
        margin: 0;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 24px;
        color: #5a5f69;
      }
      h1 {
        margin: 0;
        font-family: 'Archivo', sans-serif;
        font-weight: 900;
        font-size: 136px;
        line-height: 0.86;
        letter-spacing: -0.05em;
      }
      .block {
        flex: 0 0 220px;
        background: #ff4f00;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="text">
        <p class="kicker">Software Engineer — Lima, PE</p>
        <h1>Alessandro<br />David</h1>
      </div>
      <div class="block"></div>
    </div>
  </body>
</html>
